name: CI / Build & Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma Client
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/readtoimprove?schema=public' }}
      run: npx prisma generate

    - name: Type check
      run: npm run typecheck

    - name: Run unit tests
      run: npm run test

    - name: Apply database migrations
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: |
        if [ -n "$DATABASE_URL" ]; then
          echo "Applying Prisma migrations to target database..."
          npx prisma migrate deploy
        else
          echo "WARNING: DATABASE_URL secret is not set, skipping prisma migrate deploy."
        fi

    - name: Build Next.js application
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
        AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'f4c6e9a8b1d2c3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8' }}
      run: npm run build
